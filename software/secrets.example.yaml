# Copy to secrets.yaml (git-ignored) and replace every value.
wifi_ssid: "your-network"
wifi_password: "your-wifi-password"
# Password for the fallback access point the board opens when Wi-Fi is unreachable (8+ characters)
fallback_ap_password: "change-me-please"
# 32 random bytes, base64; also encrypts OTA updates. Generate with:  openssl rand -base64 32
api_encryption_key: "REPLACE-WITH-OUTPUT-OF-openssl-rand-base64-32"
# Password for the built-in web page (user "admin")
web_password: "change-me-please"
